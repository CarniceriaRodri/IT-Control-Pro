name: Compilar APK Alarma Solar
on:
  workflow_dispatch:
  push:
    branches: [alarma-solar-android]
    paths-ignore:
      - 'AlarmaSolarAndroid/descarga/**'
jobs:
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: AlarmaSolarAndroid
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar SDK Android
        run: |
          test -d "$ANDROID_HOME" || { echo "SDK Android no disponible"; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de prueba
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AlarmaSolarPro-APK-debug
          path: AlarmaSolarAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK para descarga directa desde Android
        run: |
          mkdir -p descarga
          cp app/build/outputs/apk/debug/app-debug.apk descarga/AlarmaSolarPro-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add descarga/AlarmaSolarPro-debug.apk
          if git diff --cached --quiet; then
            echo "APK ya publicado, sin cambios"
          else
            git commit -m "Publicar APK debug para móvil [skip ci]"
            git push origin HEAD:alarma-solar-android
          fi
