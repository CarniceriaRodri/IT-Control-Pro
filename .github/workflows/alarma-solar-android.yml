name: Compilar APK Alarma Solar
on:
  workflow_dispatch:
  push:
    branches: [alarma-solar-android]
jobs:
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: AlarmaSolarAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar SDK Android preinstalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" || true
          test -d "$ANDROID_HOME" || { echo "No existe Android SDK en el runner"; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de prueba
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AlarmaSolarPro-APK-debug
          path: AlarmaSolarAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
