name: Compilar y preparar version modular
on:
  push:
    branches:
      - desarrollo-nucleo-modular
permissions:
  contents: write
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --check server/windows.mjs
      - run: node --check server/diagnostics.mjs
      - run: node --test tests/diagnostics-node.test.mjs
      - name: Guardar version compilada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets android sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build: archivos compilados de version modular [skip ci]"
            git push
          fi
