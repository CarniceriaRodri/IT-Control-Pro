name: Comprobar compilacion IT Control Pro
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: node --check server/windows.mjs
      - run: node --check server/diagnostics.mjs
      - run: node --test tests/diagnostics-node.test.mjs

      - name: Preparar paquete de prueba Windows
        run: |
          mkdir -p paquete-it-control-pro
          cp -R index.html app.html assets modules sw.js manifest.webmanifest icon.svg paquete-it-control-pro/ 2>/dev/null || true
          cp -R server paquete-it-control-pro/
          cp -R extension-cges-casis paquete-it-control-pro/
          cp INICIAR-SERVIDOR-WINDOWS.bat paquete-it-control-pro/
          cp README.md paquete-it-control-pro/
          test -s paquete-it-control-pro/index.html
          test -d paquete-it-control-pro/assets
          test -s paquete-it-control-pro/INICIAR-SERVIDOR-WINDOWS.bat
      - name: Ofrecer descarga de aplicación compilada
        uses: actions/upload-artifact@v4
        with:
          name: IT-Control-Pro-Importador-CA-SIS-Windows
          path: paquete-it-control-pro/
          if-no-files-found: error
          retention-days: 14

      - name: Publicar versiones locales compiladas
        if: "${{ github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]') }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets android sw.js modules
          if ! git diff --cached --quiet; then
            git commit -m "build: actualizar aplicación con calculadora [skip ci]"
            git push
          fi
