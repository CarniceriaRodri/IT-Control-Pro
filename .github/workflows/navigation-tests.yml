name: Probar navegacion Atrás y Adelante
on:
  push:
    branches: [main]
    paths:
      - 'src/ui/App.tsx'
      - 'src/ui/history.ts'
      - 'src/ui/Fields.tsx'
      - 'tests/navigation.spec.ts'
      - 'scripts/**'
      - '.github/workflows/navigation-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/navigation.spec.ts --reporter=line
