name: Paquete portable Windows - IT Control Pro
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'app.html'
      - 'INICIAR-PYTHON.bat'
      - 'servidor_python.py'
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Instalar dependencias en GitHub
        run: npm ci
      - name: Incluir motor OCR e idiomas para uso sin Internet
        run: node scripts/prepare-ocr.mjs
      - name: Verificar recursos OCR
        run: |
          test -s ocr/tesseract.min.js
          test -s ocr/worker.min.js
          test -s ocr/core/tesseract-core.wasm.js
          test -s ocr/core/tesseract-core.wasm
          test -s ocr/lang/spa.traineddata.gz
          test -s ocr/lang/eng.traineddata.gz
      - name: Validar TypeScript y compilar distribución
        run: npm run build
      - name: Verificar manifiesto offline
        run: |
          test -s sw.js
          grep -q 'ocr/tesseract.min.js' sw.js
          grep -q 'ocr/lang/spa.traineddata.gz' sw.js
      - name: Preparar ZIP portable
        run: |
          mkdir -p portable
          cp index.html manifest.webmanifest icon.svg icon-192.png icon-512.png sw.js INICIAR-PYTHON.bat servidor_python.py portable/
          cp -R assets portable/
          cp -R ocr portable/
          cd portable && zip -q -r ../IT-Control-Pro-Portable-Windows.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: IT-Control-Pro-Portable-Windows
          path: IT-Control-Pro-Portable-Windows.zip
          if-no-files-found: error
          retention-days: 14
