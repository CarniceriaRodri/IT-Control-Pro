name: Verificar alarmas, grupos y tablas
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 -m py_compile *.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/*test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/network-tables.spec.ts tests/navigation.spec.ts tests/profiles.spec.ts tests/relations.spec.ts tests/platform.spec.ts --reporter=line
      - name: Mostrar contexto de errores de interfaz
        if: failure()
        run: find test-results -name error-context.md -exec cat {} \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comprobaciones-interfaz
          path: test-results/
          retention-days: 7
