<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#132b4d"><title>IT Control Pro</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{font-family:system-ui,Arial;color:#182b42;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#132b4d;color:white;padding:18px 20px}header h1{margin:0;font-size:24px}header small{color:#c9d9ef}nav{display:flex;gap:7px;overflow-x:auto;padding:12px;background:white;position:sticky;top:0}button{cursor:pointer;border:1px solid #ccd6e2;border-radius:9px;padding:10px 13px;background:white;color:#182b42;font-weight:600;white-space:nowrap}button.active,.primary{background:#1462a0;color:white;border-color:#1462a0}main{max-width:1100px;margin:auto;padding:18px}h2{margin-top:0}.notice{background:#fff5df;padding:13px;border-radius:9px;margin-bottom:15px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}input,select,textarea{font:inherit;border:1px solid #bdcad7;border-radius:8px;padding:11px;width:100%;background:white}.toolbar input{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:white;border:1px solid #dce3eb;border-radius:12px;padding:16px}.count{font-size:28px;font-weight:700;color:#1462a0}.item{display:flex;justify-content:space-between;gap:12px;align-items:start;margin:9px 0}.item strong{overflow-wrap:anywhere}.item small{display:block;color:#63748a;margin-top:4px}.actions{display:flex;gap:5px}dialog{border:0;border-radius:14px;max-width:520px;width:calc(100% - 24px);box-shadow:0 18px 60px #0004}dialog::backdrop{background:#10243c99}label{display:block;margin:11px 0;font-weight:600}label input,label textarea{margin-top:5px;font-weight:400}footer{text-align:center;padding:22px;color:#63748a}@media(max-width:550px){.item{flex-direction:column}.actions{align-self:flex-end}}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(125deg,#11243e,#176aa2);padding:22px 20px;border-radius:0 0 23px 23px}header h1{font-size:25px;letter-spacing:-.7px}header small{display:block;margin-top:4px}nav{box-shadow:0 3px 16px #132b4d10;z-index:3}nav button{border:0;background:#f0f5fa;color:#435c76}nav button.active{background:#176aa2;color:white}.card{box-shadow:0 4px 16px #172e4810}.card strong{font-size:15px}.count{font-size:32px}main{padding-bottom:110px}.notice{font-size:12px;background:#fff7e6;border:1px solid #f3dfb3}button:active{transform:scale(.98)}.appmark{display:flex;align-items:center;gap:12px}.appmark img{width:50px;height:50px;border-radius:14px}.bottom{display:none}@media(max-width:650px){header{padding:22px 17px 27px}nav{display:none}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;padding:8px 5px max(9px,env(safe-area-inset-bottom));background:white;border-top:1px solid #dce6ef;box-shadow:0 -5px 25px #142e4b12;z-index:5}.bottom button{border:0;padding:7px 2px;font-size:10px;background:transparent;color:#60748a;white-space:normal}.bottom button.active{color:#126ba8;background:#e9f4fc}.bottom button span{display:block;font-size:21px;margin-bottom:3px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:14px}.count{font-size:27px}main{padding:16px 12px 110px}.toolbar{gap:7px}} 
#install{background:#fff;color:#154c76;border:0;padding:11px 13px}#allModules{display:none}.mobileActions{display:none}@media(max-width:650px){.mobileActions{display:flex;gap:8px;padding:10px 12px;background:#f3f6fa}.mobileActions button{flex:1;min-width:0}.mobileActions button.primary{background:#1462a0;color:white}.mobileMenu{position:fixed;bottom:76px;left:10px;right:10px;z-index:7;max-height:60vh;overflow:auto;background:white;border:1px solid #dce3eb;border-radius:16px;box-shadow:0 10px 35px #142e4b35;padding:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.mobileMenu[hidden]{display:none}.mobileMenu button{white-space:normal;padding:15px 7px}} </style></head><body><header><div class="appmark"><img src="./icon.svg" alt=""><div><h1>IT Control Pro</h1><small>Centro de gestión informática · v0.2</small></div></div><button id="install" aria-label="Instalar aplicación">Instalar</button></header><nav id="nav"></nav><div class="mobileActions"><button id="menuToggle" class="primary">☷ Todos los módulos</button><button id="installMobile">⬇ Instalar app</button></div><div id="allModules" class="mobileMenu" hidden></div><div class="bottom" id="bottom"></div><main><div class="notice">🔒 Prototipo para datos públicos o ficticios. Los registros se guardan exclusivamente en este navegador. No introducir datos internos del SAS ni información personal.</div><section id="view"></section></main><footer>IT Control Pro · Herramienta de demostración, no sistema corporativo</footer><dialog id="dlg"><form id="form"><h2 id="dlgTitle"></h2><div id="fields"></div><div class="toolbar"><button type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Guardar</button></div></form></dialog><input type="file" id="import" accept=".json" hidden>
<script>
(()=>{'use strict';
const defs={Centros:['nombre','zona','dirección','teléfono'],Inventario:['equipo','tipo','serie','centro','estado'],Incidencias:['número','asunto','centro','prioridad','estado'],Almacén:['artículo','cantidad','ubicación','observaciones'],Redes:['dispositivo','ip','centro','observaciones'],Agenda:['tarea','fecha','centro','estado'],Documentación:['título','tipo','referencia','observaciones']};
const modules=['Panel',...Object.keys(defs),'Informes','Configuración'],key='it-control-pro-demo-v01';let data={},section='Panel',edit=-1,filter='';
try{data=JSON.parse(localStorage.getItem(key)||'{}')}catch{}for(const m of Object.keys(defs))if(!Array.isArray(data[m]))data[m]=[];
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(key,JSON.stringify(data)),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){ $('allModules').innerHTML=modules.map(m=>'<button data-nav="'+esc(m)+'">'+esc(m)+'</button>').join(''); $('nav').innerHTML=modules.map(m=>'<button class="'+(section===m?'active':'')+'" data-nav="'+esc(m)+'">'+esc(m)+'</button>').join('');const shortcuts=[['Panel','⌂'],['Centros','⌖'],['Inventario','▣'],['Incidencias','⚒'],['Configuración','⚙']];$('bottom').innerHTML=shortcuts.map(([m,i])=>'<button class="'+(section===m?'active':'')+'" data-nav="'+m+'"><span>'+i+'</span>'+m+'</button>').join('');let v=$('view');
if(section==='Panel'){v.innerHTML='<h2>Panel principal</h2><div class="grid">'+Object.keys(defs).map(m=>'<div class="card"><strong>'+m+'</strong><div class="count">'+data[m].length+'</div><button data-nav="'+m+'">Abrir módulo</button></div>').join('')+'</div>';return}
if(section==='Informes'){v.innerHTML='<h2>Informes</h2><div class="grid">'+Object.keys(defs).map(m=>'<div class="card"><strong>'+m+'</strong><div class="count">'+data[m].length+'</div></div>').join('')+'</div><p>Los datos pueden exportarse desde Configuración.</p>';return}
if(section==='Configuración'){v.innerHTML='<h2>Configuración y copias</h2><div class="card"><p>Los datos solo existen en este navegador. Exporta copias periódicamente.</p><div class="toolbar"><button id="export">Exportar JSON</button><button id="load">Importar JSON</button><button id="reset">Borrar datos de demostración</button></div></div>';return}
const rows=data[section].map((o,i)=>({...o,_index:i})).filter(o=>Object.values(o).some(x=>String(x).toLowerCase().includes(filter.toLowerCase())));
v.innerHTML='<h2>'+esc(section)+'</h2><div class="toolbar"><input id="search" placeholder="Buscar mientras escribes..." value="'+esc(filter)+'"><button class="primary" id="add">+ Añadir</button></div><p>'+rows.length+' registro(s)</p>'+(!rows.length?'<div class="card">No hay registros que mostrar.</div>':rows.map(o=>'<div class="card item"><div><strong>'+esc(o[defs[section][0]])+'</strong><small>'+defs[section].slice(1).map(f=>esc(f)+': '+esc(o[f])).join(' · ')+'</small></div><div class="actions"><button data-edit="'+o._index+'">Editar</button><button data-delete="'+o._index+'">Eliminar</button></div></div>').join(''))}
function form(i){edit=i;let obj=i<0?{}:data[section][i];$('dlgTitle').textContent=(i<0?'Añadir':'Editar')+' · '+section;$('fields').innerHTML=defs[section].map(f=>'<label>'+esc(f)+'<input name="'+esc(f)+'" value="'+esc(obj[f])+'" '+(f===defs[section][0]?'required':'')+'></label>').join('');$('dlg').showModal()}
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.nav){section=t.dataset.nav;filter='';$('allModules').hidden=true;render()}else if(t.id==='menuToggle'){$('allModules').hidden=!$('allModules').hidden}else if(t.id==='add')form(-1);else if(t.dataset.edit!==undefined)form(+t.dataset.edit);else if(t.dataset.delete!==undefined){if(confirm('¿Eliminar este registro?')){data[section].splice(+t.dataset.delete,1);save();render()}}else if(t.id==='cancel')$('dlg').close();else if(t.id==='export'){let blob=new Blob([JSON.stringify({app:'IT Control Pro',version:1,data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='IT-Control-Pro-copia.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}else if(t.id==='load')$('import').click();else if(t.id==='reset'&&confirm('¿Borrar todos los registros de este navegador?')){for(let m in defs)data[m]=[];save();render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){filter=e.target.value;let pos=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(pos,pos)}});
$('form').addEventListener('submit',e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target).entries());if(edit<0)data[section].push(obj);else data[section][edit]=obj;save();$('dlg').close();render()});
$('import').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let o=JSON.parse(await file.text());if(o.app!=='IT Control Pro'||!o.data||!Object.keys(defs).every(m=>Array.isArray(o.data[m])))throw Error('Formato de copia no válido');if(confirm('¿Sustituir los datos actuales por esta copia?')){for(let m in defs)data[m]=o.data[m];save();render()}}catch(err){alert('No se pudo importar: '+err.message)}e.target.value=''});
let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});async function installApp(){if(window.matchMedia('(display-mode: standalone)').matches){alert('IT Control Pro ya se está ejecutando como aplicación instalada.');return}if(deferred){const p=deferred;deferred=null;await p.prompt();await p.userChoice;return}alert('Para instalar: abre esta página en Chrome de Android, pulsa ⋮ y selecciona «Añadir a pantalla de inicio» o «Instalar aplicación». Si no aparece, comprueba que GitHub Pages esté publicado y que la página se abra con HTTPS.')} $('install').addEventListener('click',installApp);$('installMobile').addEventListener('click',installApp);if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
})();
</script></body></html>
